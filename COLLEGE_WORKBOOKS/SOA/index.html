<!DOCTYPE html>
<html>

<head>
    <title>CORS Test</title>
</head>

<body>

    <h2>CORS Test</h2>

    <button onclick="getProfile()">Get Profile</button>

    <script>
        function getProfile() {
            fetch("http://localhost:8080/profile")
                .then(response => response.text())
                .then(data => {
                    console.log(data);
                });
        }
    </script>

</body>

</html>
