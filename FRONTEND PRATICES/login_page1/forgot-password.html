<!DOCTYPE html>
<html lang="en">

<head>
    <title>Forgot password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

        <h1 class="web_name">DEMO</h1>

    </header>
    <main>
        <section>

            <h2 class="l_t">Forgot Password</h2>

            <label class="e_l" for="email">Email</label>
            <input class="e_i" type="email" id="email" placeholder=" Enter you email">

            <label class="p_l" for="password">Password</label>
            <div class="eye_Btn">
                 <input class="p_i" type="password" id="password" placeholder="Enter your new password">
                 <button class="eye_btn"  type="button">👁</button>
            </div>
           

            <label class="p_l" for="confirmPassword">Confirm_Password</label>
            <div class="eye_Btn">
                <input class="p_i" type="password" id="confirmPassword" placeholder="Enter new password">
                <button class="eye_btn"  type="button">👁</button>
            </div>
            

            <button class="opt_btn" type="button" id="otpBtn">OTP</button>
            <input class="opt_input" type="number" id="otpInput">

            <button class="submit_Btn" type="number" id="submitBtn">Submit</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
