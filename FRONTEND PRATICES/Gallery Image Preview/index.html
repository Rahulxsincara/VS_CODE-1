<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery image preview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="gallery-container">
        <!-- Main Preview -->
        <div class="main-preview">
            <img id="mainImage" src="../IMAGES/download (4).jpg" alt="Main Preview">

            <!-- Overlay controls -->
            <div class="overlay-controls">
                <svg class="control-icon" viewBox="0 0 24 24">
                    <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z" />
                    <path d="M12 14c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z" />
                </svg>
                <svg class="control-icon" viewBox="0 0 24 24">
                    <path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z" />
                </svg>
            </div>

            <!-- Time Indicator — moved INSIDE main-preview -->
            <div class="time-indicator">0:03 / 0:08</div>
        </div>

        <!-- Thumbnail Strip -->
        <div class="thumbnail-strip" id="thumbStrip">
            <div class="thumb-item active" data-src="../IMAGES/download (1).jpg">
                <img src="../IMAGES/download (1).jpg" alt="Thumb 1">
            </div>
            <div class="thumb-item" data-src="../IMAGES/download (4).jpg">
                <img src="../IMAGES/download (4).jpg" alt="Thumb 2">
            </div>
            <div class="thumb-item" data-src="../IMAGES/download (5).jpg">
                <img src="../IMAGES/download (5).jpg" alt="Thumb 3">
            </div>
            <div class="thumb-item" data-src="../IMAGES/download (7).jpg">
                <img src="../IMAGES/download (7).jpg" alt="Thumb 4">
            </div>
            <div class="thumb-item" data-src="../IMAGES/guts-amoled-5120x2880-18716.jpg">
                <img src="../IMAGES/guts-amoled-5120x2880-18716.jpg" alt="Guts">
            </div>
            <div class="thumb-item" data-src="../IMAGES/itachi-uchiha-red-3840x2160-25727.png">
                <img src="../IMAGES/itachi-uchiha-red-3840x2160-25727.png" alt="Itachi">
            </div>
            <div class="thumb-item" data-src="../IMAGES/kame-house-dragon-3840x2160-25003.jpg">
                <img src="../IMAGES/kame-house-dragon-3840x2160-25003.jpg" alt="Kame House">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
